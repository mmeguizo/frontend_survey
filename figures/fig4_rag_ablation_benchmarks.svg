<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 660" width="1150" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow4" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1090" height="55" rx="8" fill="#1e293b" />
  <text x="575" y="45" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Fig. 4. Empirical Performance Benchmarking Across RAG Experimental Ablation Configurations (N = 100)</text>
  <text x="575" y="64" text-anchor="middle" fill="#94a3b8" font-size="11.5">Evaluating Precision@5, Recall@5, Mean Reciprocal Rank (MRR), Answer Faithfulness, and Hallucination Rates (Strictly Matching Table V)</text>

  <!-- PANEL 1: RETRIEVAL QUALITY (P@5, R@5, MRR) -->
  <rect x="30" y="95" width="530" height="535" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow4)" />
  <rect x="30" y="95" width="530" height="36" rx="8" fill="#e0e7ff" />
  <text x="295" y="119" text-anchor="middle" fill="#3730a3" font-size="13" font-weight="bold">A. Information Retrieval Quality Metrics (P@5, R@5, MRR)</text>

  <!-- Y-Axis -->
  <line x1="85" y1="160" x2="85" y2="480" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="85" y1="480" x2="520" y2="480" stroke="#94a3b8" stroke-width="1.5" />

  <text x="75" y="485" text-anchor="end" fill="#64748b" font-size="10">0.0</text>
  <line x1="80" y1="480" x2="520" y2="480" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

  <text x="75" y="415" text-anchor="end" fill="#64748b" font-size="10">0.25</text>
  <line x1="80" y1="415" x2="520" y2="415" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

  <text x="75" y="350" text-anchor="end" fill="#64748b" font-size="10">0.50</text>
  <line x1="80" y1="350" x2="520" y2="350" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

  <text x="75" y="285" text-anchor="end" fill="#64748b" font-size="10">0.75</text>
  <line x1="80" y1="285" x2="520" y2="285" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

  <text x="75" y="220" text-anchor="end" fill="#64748b" font-size="10">1.00</text>
  <line x1="80" y1="220" x2="520" y2="220" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Scale: 1.0 = 260 px height (from Y=480 up to Y=220) -> Height = val * 260 -->

  <!-- Arm 2: Open Web RAG (P=0.58, R=0.64, MRR=0.65) -->
  <rect x="95" y="329" width="16" height="151" rx="2" fill="#93c5fd" />
  <rect x="113" y="314" width="16" height="166" rx="2" fill="#3b82f6" />
  <rect x="131" y="311" width="16" height="169" rx="2" fill="#1d4ed8" />
  <text x="121" y="498" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="bold">Arm 2</text>
  <text x="121" y="510" text-anchor="middle" fill="#64748b" font-size="7.5">Open Web</text>

  <!-- Arm 3a: Lexical KB (P=0.42, R=0.46, MRR=0.51) -->
  <rect x="165" y="371" width="16" height="109" rx="2" fill="#93c5fd" />
  <rect x="183" y="360" width="16" height="120" rx="2" fill="#3b82f6" />
  <rect x="201" y="347" width="16" height="133" rx="2" fill="#1d4ed8" />
  <text x="191" y="498" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="bold">Arm 3a</text>
  <text x="191" y="510" text-anchor="middle" fill="#64748b" font-size="7.5">Lex KB</text>

  <!-- Arm 3b: Lexical Tickets (P=0.46, R=0.50, MRR=0.54) -->
  <rect x="235" y="360" width="16" height="120" rx="2" fill="#93c5fd" />
  <rect x="253" y="350" width="16" height="130" rx="2" fill="#3b82f6" />
