  <text x="261" y="510" text-anchor="middle" fill="#64748b" font-size="7.5">Lex Tickets</text>

  <!-- Arm 3c: Unified Lexical (P=0.51, R=0.56, MRR=0.60) -->
  <rect x="305" y="347" width="16" height="133" rx="2" fill="#93c5fd" />
  <rect x="323" y="334" width="16" height="146" rx="2" fill="#3b82f6" />
  <rect x="341" y="324" width="16" height="156" rx="2" fill="#1d4ed8" />
  <text x="331" y="498" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="bold">Arm 3c</text>
  <text x="331" y="510" text-anchor="middle" fill="#64748b" font-size="7.5">Unified Lex</text>

  <!-- Arm 4: Dense Vector Only (P=0.74, R=0.81, MRR=0.79) -->
  <rect x="375" y="288" width="16" height="192" rx="2" fill="#93c5fd" />
  <rect x="393" y="269" width="16" height="211" rx="2" fill="#3b82f6" />
  <rect x="411" y="275" width="16" height="205" rx="2" fill="#1d4ed8" />
  <text x="401" y="498" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="bold">Arm 4</text>
  <text x="401" y="510" text-anchor="middle" fill="#64748b" font-size="7.5">Dense Vec</text>

  <!-- Arm 5: Proposed Hybrid (P=0.86, R=0.92, MRR=0.89) -->
  <rect x="445" y="256" width="16" height="224" rx="2" fill="#86efac" stroke="#16a34a" stroke-width="1" />
  <rect x="463" y="241" width="16" height="239" rx="2" fill="#22c55e" stroke="#16a34a" stroke-width="1" />
  <rect x="481" y="249" width="16" height="231" rx="2" fill="#15803d" stroke="#16a34a" stroke-width="1" />
