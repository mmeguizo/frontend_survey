<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1140" height="55" rx="8" fill="#1e293b" />
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Fig. 1. Decoupled Three-Tier System Architecture and Hybrid RAG Subsystem</text>
  <text x="600" y="64" text-anchor="middle" fill="#94a3b8" font-size="12">CHMSU AI-Augmented IT Service Management (ITSM) Platform with Closed-Loop SECI Knowledge Capture</text>

  <!-- TIER 1: PRESENTATION TIER -->
  <rect x="30" y="95" width="280" height="330" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="30" y="95" width="280" height="36" rx="8" fill="#e0f2fe" />
  <text x="170" y="119" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="bold">1. Presentation Tier (Angular 20 SPA)</text>

  <rect x="45" y="145" width="250" height="48" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
  <text x="55" y="166" fill="#0c4a6e" font-size="12" font-weight="bold">Reactive State &amp; UI Components</text>
  <text x="55" y="182" fill="#64748b" font-size="10.5">Angular Signals • OnPush • Ant Design (NG-ZORRO)</text>

  <rect x="45" y="202" width="250" height="48" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
  <text x="55" y="223" fill="#0c4a6e" font-size="12" font-weight="bold">Real-Time Analytics &amp; Visuals</text>
  <text x="55" y="239" fill="#64748b" font-size="10.5">Chart.js Live SLA Dashboards • Export PDF/XLSX</text>

  <rect x="45" y="260" width="250" height="48" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
  <text x="55" y="281" fill="#0c4a6e" font-size="12" font-weight="bold">Intelligent Triage &amp; Chatbot UI</text>
  <text x="55" y="297" fill="#64748b" font-size="10.5">WebSocket Token Stream • Debounced UI (80 ms)</text>

  <rect x="45" y="318" width="250" height="48" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
  <text x="55" y="339" fill="#0c4a6e" font-size="12" font-weight="bold">Role-Based Portals (8 RBAC Roles)</text>
  <text x="55" y="355" fill="#64748b" font-size="10.5">End-User • Secretary • Director • MIS/ITS • Admin</text>

  <rect x="45" y="375" width="250" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
  <text x="170" y="393" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">Native ARTA CSM Digital Survey</text>
  <text x="170" y="407" text-anchor="middle" fill="#b45309" font-size="9.5">Gated Ticket Closure (CC1-CC3, SQD0-SQD8)</text>

  <!-- TIER 2: APPLICATION & ORCHESTRATION TIER -->
  <rect x="340" y="95" width="440" height="330" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="340" y="95" width="440" height="36" rx="8" fill="#f3e8ff" />
  <text x="560" y="119" text-anchor="middle" fill="#6b21a8" font-size="14" font-weight="bold">2. Application &amp; Orchestration Tier (Node.js / Express)</text>

  <rect x="355" y="145" width="410" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="365" y="166" fill="#581c87" font-size="12" font-weight="bold">API Gateway &amp; Authentication Subsystem</text>
  <text x="365" y="182" fill="#64748b" font-size="10.5">Apollo Server v4 GraphQL (Queries/Mutations) • WebSocket Subscriptions • JWT / SSO</text>

  <rect x="355" y="206" width="198" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="365" y="226" fill="#581c87" font-size="11.5" font-weight="bold">Skill-Aware Routing Engine</text>
  <text x="365" y="242" fill="#64748b" font-size="9.5">Lexicographical Matching:</text>
  <text x="365" y="256" fill="#334155" font-size="9.5">1. Tech Skill Tags  2. Lowest Active Workload</text>

  <rect x="567" y="206" width="198" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="577" y="226" fill="#581c87" font-size="11.5" font-weight="bold">SLA Background Daemon</text>
  <text x="577" y="242" fill="#64748b" font-size="9.5">5-min Cron • Business Hours (8-5)</text>
  <text x="577" y="256" fill="#dc2626" font-size="9.5">Two-Tier Supervisory Escalation</text>

  <rect x="355" y="278" width="198" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="365" y="298" fill="#581c87" font-size="11.5" font-weight="bold">RA 10173 PII Redaction Filter</text>
  <text x="365" y="314" fill="#64748b" font-size="9.5">Regex &amp; Named-Entity Scrubbing:</text>
  <text x="365" y="328" fill="#334155" font-size="9.5">Names, IDs, Emails, Phone Numbers</text>

  <rect x="567" y="278" width="198" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="577" y="298" fill="#581c87" font-size="11.5" font-weight="bold">Closed-Loop SECI Indexer</text>
  <text x="577" y="314" fill="#64748b" font-size="9.5">On 'RESOLVED' → Auto-extract fix</text>
  <text x="577" y="328" fill="#059669" font-size="9.5">Quality Gate: Head Audit → Public Vector</text>

  <rect x="355" y="350" width="410" height="65" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="365" y="371" fill="#065f46" font-size="12" font-weight="bold">Finite State Machine &amp; Approval Governance (6 Stages / 10 States)</text>
  <text x="365" y="390" fill="#047857" font-size="10.5">FOR_REVIEW → REVIEWED → DIRECTOR_APPROVED → ASSIGNED → PENDING →</text>
  <text x="365" y="406" fill="#047857" font-size="10.5">IN_PROGRESS (ON_HOLD pause) → RESOLVED → ARTA Survey → CLOSED</text>

  <!-- TIER 3: PERSISTENCE TIER -->
  <rect x="810" y="95" width="360" height="330" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="810" y="95" width="360" height="36" rx="8" fill="#fee2e2" />
  <text x="990" y="119" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">3. Persistence Tier (MySQL 8 + Prisma ORM)</text>

  <rect x="825" y="145" width="330" height="78" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1" />
  <text x="835" y="166" fill="#7f1d1d" font-size="12" font-weight="bold">Polymorphic Ticket Architecture</text>
  <text x="835" y="183" fill="#334155" font-size="10">• Universal Parent Ticket (SLA clocks, priority, audit log)</text>
  <text x="835" y="199" fill="#334155" font-size="10">• 1:1 Strict Child Schema: MISTicket (web/soft) OR ITSTicket (hw/net)</text>
  <text x="835" y="215" fill="#64748b" font-size="9.5">• Concurrency-Safe Sequential Control Numbers</text>

  <rect x="825" y="233" width="330" height="82" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1" />
  <text x="835" y="253" fill="#7f1d1d" font-size="12" font-weight="bold">Relational Entities &amp; Integrity Constraints</text>
  <text x="835" y="270" fill="#334155" font-size="10">• TicketAssignments (multi-staff) • TicketStatusHistory (atomic audit)</text>
  <text x="835" y="286" fill="#334155" font-size="10">• TicketNotes (public vs. staff diagnostic notes) • UserSkills</text>
  <text x="835" y="302" fill="#334155" font-size="10">• ArtaSurvey (CC1-3, SQD0-8) • ChatSessionTelemetry</text>

  <rect x="825" y="325" width="330" height="88" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="835" y="345" fill="#92400e" font-size="12" font-weight="bold">Vector Store &amp; Full-Text Repositories</text>
  <text x="835" y="363" fill="#78350f" font-size="10">• TroubleshootingSolution (768-dim float vector in JSON)</text>
  <text x="835" y="379" fill="#78350f" font-size="10">• KnowledgeBaseArticle (MySQL Boolean Full-Text index)</text>
  <text x="835" y="395" fill="#78350f" font-size="10">• Historical Resolved Ticket Index (Problem + Solution synthesis)</text>
  <text x="835" y="407" fill="#92400e" font-size="9">• Similarity threshold calibrated: tau = 0.40</text>

  <!-- LOWER SECTION: THE AI / RAG & MULTI-TIER ENGINE -->
  <rect x="30" y="445" width="1140" height="350" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="30" y="445" width="1140" height="36" rx="8" fill="#dcfce7" />
  <text x="600" y="469" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">4. Closed-Domain Hybrid RAG Pipeline, Provenance Router, and 4-Tier Fallback Cascade</text>

  <!-- Step A: Query & Provenance -->
  <rect x="45" y="495" width="250" height="285" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="170" y="518" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">A. Epistemic Provenance Routing</text>

  <rect x="55" y="532" width="230" height="44" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="65" y="550" fill="#166534" font-size="10" font-weight="bold">User Query Pre-Processing</text>
  <text x="65" y="566" fill="#4b5563" font-size="9">ICT filter • Role-gating • Frustration heuristic</text>

  <rect x="55" y="584" width="230" height="62" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="65" y="602" fill="#991b1b" font-size="10" font-weight="bold">Institution Query Gate (Regex)</text>
  <text x="65" y="618" fill="#b91c1c" font-size="9">Matches campus terms (CHMSU, portal, etc.)</text>
  <text x="65" y="634" fill="#dc2626" font-size="9" font-weight="bold">→ BLOCKS EXTERNAL WEB SEARCH</text>

  <rect x="55" y="654" width="230" height="55" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="65" y="672" fill="#1e40af" font-size="10" font-weight="bold">General Technical Query Path</text>
  <text x="65" y="688" fill="#1d4ed8" font-size="9">Permits external web grounding if internal</text>
  <text x="65" y="700" fill="#1d4ed8" font-size="9">sources return zero matches</text>

  <rect x="55" y="717" width="230" height="50" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="65" y="735" fill="#92400e" font-size="10" font-weight="bold">Frustration / Unknown Policy</text>
  <text x="65" y="752" fill="#b45309" font-size="9">Bypasses LLM → Auto 1-click Ticket Payload</text>

  <!-- Step B: 4-Source Parallel Retrieval -->
  <rect x="310" y="495" width="340" height="285" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="480" y="518" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">B. 4-Source Parallel Hybrid Retriever</text>

  <rect x="325" y="532" width="310" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="335" y="550" fill="#0f172a" font-size="10" font-weight="bold">Source 1: Published KB Articles</text>
  <text x="335" y="565" fill="#64748b" font-size="9">MySQL Boolean Full-Text Search (Top-k = 5)</text>

  <rect x="325" y="582" width="310" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="335" y="600" fill="#0f172a" font-size="10" font-weight="bold">Source 2: Historical Resolved Tickets</text>
  <text x="335" y="615" fill="#64748b" font-size="9">Title + Description + Resolution Full-Text (Top-k = 5)</text>

  <rect x="325" y="632" width="310" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="335" y="650" fill="#0f172a" font-size="10" font-weight="bold">Source 3: Curated Problem-Solution Pairs</text>
  <text x="335" y="665" fill="#64748b" font-size="9">Full-Text Keyword Match on Auto-Extracted Solutions</text>

  <rect x="325" y="682" width="310" height="52" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="335" y="700" fill="#065f46" font-size="10" font-weight="bold">Source 4: Dense Vector Similarity (768-dim)</text>
  <text x="335" y="715" fill="#047857" font-size="9">Cosine Sim: q · s / (|q|·|s|) ≥ tau (tau = 0.40)</text>
  <text x="335" y="726" fill="#047857" font-size="9">Embeddings: text-embedding-004 (gemini-emb-001 ready)</text>

  <rect x="325" y="740" width="310" height="30" rx="4" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1" />
  <text x="480" y="758" text-anchor="middle" fill="#3730a3" font-size="9.5" font-weight="bold">Rank Fusion: Dense Vector &gt; Lexical (Dedup &amp; Truncate to k=5)</text>

  <!-- Step C: 4-Tier Fallback Cascade -->
  <rect x="665" y="495" width="490" height="285" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="910" y="518" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">C. 4-Tier Graceful Degradation Cascade (Timeout: 45s / 8s Notice)</text>

  <!-- Tier 1 -->
  <rect x="680" y="532" width="460" height="52" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="690" y="550" fill="#166534" font-size="10.5" font-weight="bold">Tier 1: Google Gemini (gemini-2.5-flash) [PRIMARY CLOUD]</text>
  <text x="690" y="565" fill="#334155" font-size="9.5">• Tier 1a: Internal RAG with Strict Grounding Hierarchy (KB &gt; Fixes &gt; Tickets)</text>
  <text x="690" y="577" fill="#334155" font-size="9.5">• Tier 1b: Google Search Grounding (Generic technical queries only)</text>

  <!-- Tier 2 -->
  <rect x="680" y="590" width="460" height="44" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="690" y="608" fill="#1e40af" font-size="10.5" font-weight="bold">Tier 2: Perplexity SSE API [SECONDARY CLOUD FALLBACK]</text>
  <text x="690" y="623" fill="#334155" font-size="9.5">Invoked if Gemini exceeds 45s, returns HTTP 429 rate limit, or network drop</text>

  <!-- Tier 3 -->
  <rect x="680" y="640" width="460" height="44" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
  <text x="690" y="658" fill="#6b21a8" font-size="10.5" font-weight="bold">Tier 3: Hugging Face Qwen/Qwen2.5-72B-Instruct [TERTIARY FALLBACK]</text>
  <text x="690" y="673" fill="#334155" font-size="9.5">Open-weights cloud inference; 20-word simulated chunk streaming (30 ms intervals)</text>

  <!-- Tier 4 -->
  <rect x="680" y="690" width="460" height="52" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="690" y="708" fill="#92400e" font-size="10.5" font-weight="bold">Tier 4: Deterministic Local Offline Templates [100% RELIABILITY]</text>
  <text x="690" y="723" fill="#78350f" font-size="9.5">6 Core Campus Scenarios: Password Reset • Wi-Fi/Network • Printer Maintenance</text>
  <text x="690" y="735" fill="#78350f" font-size="9.5">Projector/AV Booking • Software Installation • Desktop/Hardware Issue (&lt; 15 ms latency)</text>

  <rect x="680" y="748" width="460" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="910" y="764" text-anchor="middle" fill="#991b1b" font-size="9" font-weight="bold">Circuit Breaker: Automated Admin Alert dispatched upon 3 consecutive cloud failures</text>

  <!-- CONNECTING ARROWS -->
  <path d="M 310 240 L 335 240" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 780 240 L 805 240" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" fill="none" />
