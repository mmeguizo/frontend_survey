<div class="adm-login-page">
  <mat-card class="adm-login-card">
    <div class="adm-login-logo-wrap">
      <img src="assets/chmsu-logo.png" alt="CHMSU Logo" class="adm-login-logo">
    </div>
    <h1 class="adm-login-title">SURVEY</h1>
    <p class="adm-login-subtitle">Client Satisfaction Measurement</p>
    <p class="adm-login-org">Carlos Hilado Memorial State University</p>

    <mat-card-content>
      <form *ngIf="!showForgotPassword" [formGroup]="loginForm" (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="adm-full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" required>
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="adm-full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" required>
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>
        <div class="adm-forgot-row">
          <a (click)="toggleForgotPassword()" class="adm-forgot-link">Forgot password?</a>
        </div>
        <button mat-raised-button color="primary" type="submit" class="adm-full-width adm-login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <form *ngIf="showForgotPassword && !resetToken" [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetEmail()">
        <div *ngIf="!resetToken" class="adm-forgot-heading">
          Reset Password
        </div>
        <mat-form-field appearance="outline" class="adm-full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" required>
          <mat-icon matPrefix>mail</mat-icon>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" class="adm-full-width adm-login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
        <button mat-button type="button" class="adm-full-width adm-back-btn" (click)="toggleForgotPassword()">
          Back to Login
        </button>
      </form>

      <form *ngIf="showForgotPassword && resetToken" [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
        <div class="adm-forgot-heading">Set New Password</div>
        <mat-form-field appearance="outline" class="adm-full-width">
          <mat-label>New Password</mat-label>
          <input matInput type="password" formControlName="newPassword" autocomplete="new-password" required>
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="adm-full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" required>
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" class="adm-full-width adm-login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
        <button mat-button type="button" class="adm-full-width adm-back-btn" (click)="toggleForgotPassword()">
          Back to Login
        </button>
      </form>
    </mat-card-content>

    <div class="adm-login-footer">
      <a routerLink="/survey" class="adm-back-link">
        <mat-icon>arrow_back</mat-icon> Back to Survey
      </a>
    </div>
  </mat-card>
</div>
